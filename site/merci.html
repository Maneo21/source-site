<body>
<header class="top scrolled" data-top>

<main class="page" id="main">
  <svg class="okmark" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="36"/><path d="M25 41l10 10 21-22"/></svg>

  <h1 class="page-h1" data-i18n="merci.title">Merci !</h1>
  <p class="page-lead" data-m="lead"></p>
  <div class="steps merci-steps" style="--p:1">
    <span class="st-line" aria-hidden="true"><i></i></span>
    <ol class="st-list">
        <li class="step on"><span class="st-n">1</span><div><h3 data-m="steps.0.t"></h3><p data-m="steps.0.d"></p></div></li>

        <li class="step on"><span class="st-n">3</span><div><h3 data-m="steps.2.t"></h3><p data-m="steps.2.d"></p></div></li>
        <li class="step on"><span class="st-n">4</span><div><h3 data-m="steps.3.t"></h3><p data-m="steps.3.d"></p></div></li>
    </ol>
  </div>
  <a class="btn btn-p merci-send" data-send hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><path d="M4 7.5l8 6 8-6"/></svg><span data-m="send"></span></a>

    <p data-m="help"></p>
